<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="index.css">
    <title>Dashboard de Mensajes - EL PROYECTO</title>
    <style>
        .admin-table { width: 100%; border-collapse: collapse; margin-top: 20px; background: var(--card-bg); color: var(--text-color); }
        .admin-table th, .admin-table td { padding: 15px; border: 1px solid var(--border-color); text-align: left; }
        .admin-table th { background: var(--accent-color); color: white; }
        .badge { padding: 5px 10px; border-radius: 15px; font-size: 0.8rem; font-weight: bold; }
        .badge-ventas { background: #2ecc71; color: white; }
        .badge-soporte { background: #e67e22; color: white; }
        .badge-vacante { background: #3498db; color: white; }
    </style>
</head>
<body class="dark-mode"> <div class="container section">
        <h1>Bandeja de Entrada</h1>
        <p>Gestiona aquí los mensajes recibidos desde la página de contacto.</p>
        
        <table class="admin-table">
            <thead>
                <tr>
                    <th>Fecha</th>
                    <th>Categoría</th>
                    <th>Usuario / Empresa</th>
                    <th>Contacto</th>
                    <th>Mensaje / Detalle</th>
                </tr>
            </thead>
            <tbody id="lista-mensajes">
                </tbody>
        </table>
        
        <button onclick="localStorage.removeItem('mensajes_proyecto'); location.reload();" class="btn-main" style="margin-top:20px; background: #e74c3c;">Vaciar Bandeja</button>
        <button onclick="window.location.href='index.html'" class="btn-main">Regresar a la Web</button>
        <button onclick="sessionStorage.clear(); window.location.href='login.html';" class="btn-main" style="background: #7f8c8d;">Cerrar Sesión</button>
    </div>

    <script>
    // 1. Protección de ruta
    if (sessionStorage.getItem('isLoggedIn') !== 'true') {
        window.location.href = 'login.html';
    }

    const mensajes = JSON.parse(localStorage.getItem('mensajes_proyecto')) || [];
    const tbody = document.getElementById('lista-mensajes');

    if (mensajes.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; padding: 20px;">No hay mensajes registrados.</td></tr>`;
    } else {
        // Invertimos para ver los más nuevos arriba
        [...mensajes].reverse().forEach(m => {
            const claseBadge = m.tipo === 'Ventas' ? 'badge-ventas' : 
                               m.tipo === 'Soporte' ? 'badge-soporte' : 'badge-vacante';
            
            tbody.innerHTML += `
                <tr>
                    <td>${m.fecha}</td>
                    <td><span class="badge ${claseBadge}">${m.tipo}</span></td>
                    <td>${m.nombre}</td>
                    <td>${m.contacto}</td>
                    <td>${m.detalle}</td> 
                </tr>
            `;
        });
    }
</script>
</body>
</html>
